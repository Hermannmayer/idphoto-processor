name: build-release

# 触发方式：
#   - 推 master 分支 → 编译，产出「安装程序」与「免安装版 zip」两个工件
#   - 推 v* 标签（如 v1.0.0）→ 编译并自动创建 GitHub Release
#   - 手动：Actions → build-release → Run workflow
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  APP_NAME: idphoto-processor

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # 允许创建 GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      # 几秒钟就能挡住模型/依赖类问题，避免打完包才发现跑不起来
      - name: Smoke test (模型与依赖自检)
        run: python tools/smoke_test.py

      - name: Build EXE (onedir)
        run: pyinstaller --clean --noconfirm ${{ env.APP_NAME }}.spec

      # 打包漏收 web/ 或 WebView2 程序集时不会报错，只会白屏 / 窗口起不来 —— 这里挡住
      - name: Verify bundled assets
        shell: pwsh
        run: |
          $root = "dist/${{ env.APP_NAME }}/_internal"
          $need = @(
            "$root/web/index.html",
            "$root/web/style.css",
            "$root/web/app.js",
            "$root/pythonnet/runtime/Python.Runtime.dll",
            "$root/webview/lib/Microsoft.Web.WebView2.Core.dll",
            "$root/webview/lib/Microsoft.Web.WebView2.WinForms.dll"
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            throw "打包产物缺少：`n$($missing -join "`n")"
          }
          echo "bundled assets OK"

      # windows-latest 自 2025-09 起不再预装 Inno Setup，需要自己装一份
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          curl.exe -sL -o "$env:TEMP\innosetup.exe" $url
          Start-Process "$env:TEMP\innosetup.exe" -Wait -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 未安装成功：$iscc" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer (安装程序)
        shell: pwsh
        run: |
          # 版本号由 git 标签决定（v1.2.3 → 1.2.3）
          $ver = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else { '0.0.0-dev' }
          & "$env:ISCC" "/DAppVersion=$ver" installer\app.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败" }
          Get-ChildItem installer\out

      - name: Upload installer (Actions 页面可直接下载)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-setup
          path: installer/out/*.exe

      - name: Upload portable zip (免安装版)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-portable
          path: dist/${{ env.APP_NAME }}/

      - name: Publish GitHub Release (打 v* 标签时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/out/*.exe
          tag_name: ${{ github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          body: |
            证件照批量处理工具 - 自动构建版。

            - 版本：`${{ github.ref_name }}`（由 git 标签决定，实现版本控制）
            - 下载下方的 `IDPhotoProcessor-Setup-*.exe` 运行安装，会装到 `C:\IDPhotoProcessor`
              并创建桌面图标；升级时直接再运行一次新版本安装包即可覆盖。
            - 使用说明见仓库 README。
          draft: false
          prerelease: false
